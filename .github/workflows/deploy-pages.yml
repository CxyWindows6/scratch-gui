name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # scratch-render 等 git 依赖的 devDeps 含 playwright-chromium，
      # npm 安装 git 依赖时会连带安装其 devDeps，postinstall 会尝试下载
      # Chromium/ffmpeg（几百 MB，经常超时导致 CI 失败）。
      # 构建/部署不需要浏览器，跳过下载即可。
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always build with the newest commit on scratch-vm's surge-editor branch
      # instead of the commit pinned in package-lock.json.
      # --force 强制重新解析 git 分支依赖（否则 npm 可能静默复用 lock 里的旧 commit）
      # 刷新后自检修复标记；缺失则直接失败，防止旧 VM 被部署上线。
      - name: Refresh scratch-vm to latest surge-editor commit
        run: |
          npm install github:CxyWindows6/scratch-vm#surge-editor --no-audit --no-fund --force
          echo "Installed scratch-vm commit:"
          node -e "console.log(require('./node_modules/scratch-vm/package.json').gitHead || 'unknown')"
          if grep -q "_drawAfterStep" node_modules/scratch-vm/src/engine/tw-frame-loop.js; then
            echo "OK: scratch-vm contains step-synchronized render fix (_drawAfterStep)"
          else
            echo "ERROR: scratch-vm is missing render fix!" >&2
            exit 1
          fi

      - name: Build Surge Editor
        # 必须显式设 NODE_ENV=production：webpack 以 NODE_ENV 决定 mode 和输出
        # 文件名（production = js/pentapod/[name].[contenthash].js；否则 dev 构建
        # 输出 js/[name].js 且 React 用 development 版，性能极差、文件名永远不变
        # 导致 CF 边缘缓存钉住旧构建——这就是“部署成功但修复没上线/跑酷卡顿”的根因。
        run: NODE_ENV=production npm run build

      # 记录本次构建实际使用的 scratch-vm 版本到部署产物里，
      # 部署后可通过 https://surge-editor.pages.dev/vm-version.txt 直接验证
      # CI 装配的是哪个 commit，避免“部署成功但 VM 是旧的”再次发生。
      - name: Record scratch-vm version
        run: |
          mkdir -p build
          {
            echo "lock-resolved:"
            node -e "console.log(require('./package-lock.json').packages['node_modules/scratch-vm'].resolved)"
            echo "installed-source-fix-marker:"
            grep -c "_drawAfterStep" node_modules/scratch-vm/src/engine/tw-frame-loop.js || true
          } > build/vm-version.txt
          cat build/vm-version.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=surge-editor --commit-dirty=true
