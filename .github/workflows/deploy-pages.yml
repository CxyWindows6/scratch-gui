name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always build with the newest commit on scratch-vm's surge-editor branch
      # instead of the commit pinned in package-lock.json.
      # --force 强制重新解析 git 分支依赖（否则 npm 可能静默复用 lock 里的旧 commit）
      # 刷新后自检修复标记；缺失则直接失败，防止旧 VM 被部署上线。
      - name: Refresh scratch-vm to latest surge-editor commit
        run: |
          npm install github:CxyWindows6/scratch-vm#surge-editor --no-audit --no-fund --force
          echo "Installed scratch-vm commit:"
          node -e "console.log(require('./node_modules/scratch-vm/package.json').gitHead || 'unknown')"
          if grep -q "stepsSinceRender" node_modules/scratch-vm/src/engine/tw-frame-loop.js; then
            echo "OK: scratch-vm contains render-gate fix (stepsSinceRender)"
          else
            echo "ERROR: scratch-vm is missing render-gate fix!" >&2
            exit 1
          fi

      - name: Build Surge Editor
        run: npm run build

      # 记录本次构建实际使用的 scratch-vm 版本到部署产物里，
      # 部署后可通过 https://surge-editor.pages.dev/vm-version.txt 直接验证
      # CI 装配的是哪个 commit，避免“部署成功但 VM 是旧的”再次发生。
      - name: Record scratch-vm version
        run: |
          mkdir -p build
          {
            echo "lock-resolved:"
            node -e "console.log(require('./package-lock.json').packages['node_modules/scratch-vm'].resolved)"
            echo "installed-source-fix-marker:"
            grep -c "stepsSinceRender" node_modules/scratch-vm/src/engine/tw-frame-loop.js || true
          } > build/vm-version.txt
          cat build/vm-version.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=surge-editor --commit-dirty=true
